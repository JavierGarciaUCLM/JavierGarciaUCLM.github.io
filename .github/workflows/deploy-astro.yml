name: Deploy Astro to GitHub Pages

on:
  push:
    branches: [ "main" ]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    # Permisos mínimos del GITHUB_TOKEN: solo escribir en el repo (rama gh-pages)
    permissions:
      contents: write

    steps:
      # 1) Descarga el código del repo
      - name: Check out code
        uses: actions/checkout@v3

      # 2) Usa Node (versión fijada en .nvmrc: 24 LTS)
      - name: Use Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc

      # 3) Instala exactamente las versiones de package-lock.json
      #    (--legacy-peer-deps sigue siendo necesario por @astrojs/tailwind)
      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      # 4) Compila tu proyecto Astro (genera carpeta dist/)
      - name: Build
        run: |
          npm run build  # o 'pnpm run build'

      # 5) Despliega la carpeta dist/ a GH Pages (rama gh-pages)
      - name: Deploy to GH Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
          publish_branch: gh-pages
